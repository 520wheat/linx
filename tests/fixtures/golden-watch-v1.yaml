# 测试夹具：《年会夜的金表》第一版（#46 之前），给规则、意图、陪玩屏等单元测试使用。
# 正式案件在 cases/ 下，改版不影响这里。
# 格式说明见 src/pozhan/case/model.py；改完后运行 `uv run pozhan check cases/golden-watch.yaml` 校验。

id: golden-watch
title: 年会夜的金表

briefing: >-
  公司年会当晚九点到十点之间，十八楼老板办公室保险柜里的一块样品金表不见了。
  监控显示这段时间只有一个人离开过楼下的 KTV 包厢——行政主管林志远。
  他现在就坐在你们对面。

suspect:
  name: 林志远
  persona: >-
    三十八岁，公司行政主管，在公司干了十年，八面玲珑，说话爱打官腔，
    喜欢用「我们行政部」「流程上」这类词给自己壮胆。表面客气配合，
    被逼急了会抱怨自己工作辛苦、没人体谅。欠了一笔不小的私人债务，绝不主动提起。
  stolen: [金表, 表]  # 被盗物的叫法，守卫用来识别提前认罪
  truth:
    - 九点二十分左右，林志远借口去洗手间离开 KTV 包厢。
    - 九点三十二分，他独自乘电梯上了十八楼。行政部在十六楼，十八楼只有老板办公室和一间储物间。
    - 他知道保险柜密码：半年前替老板记过一次，写在便利贴上，贴在行政部打印机旁边，一直没撕。
    - 他用密码打开保险柜，拿走了样品金表，金表盒上留下了他的指纹。
    - 九点五十五分左右他回到包厢，连点了三首歌，装作一直在场。
    - 他打算先拿表去抵押周转，等年终奖发下来再赎回放回去。

claims:
  - id: 1
    text: 九点到十点，我一直在楼下 KTV 包厢，没离开过。
    lie: true
  - id: 2
    text: 保险柜密码？我根本不知道。
    lie: true
  - id: 3
    text: 那块表我碰都没碰过。
    lie: true

cards:
  - id: 1
    title: KTV 点歌记录
    text: 九点二十到九点五十，包厢里没有任何人点歌；九点五十五分之后林志远连点了三首歌。
  - id: 2
    title: 电梯监控截图
    text: 九点三十二分，林志远独自乘电梯到了十八楼。
  - id: 3
    title: 便利贴照片
    text: 行政部打印机旁贴着一张便利贴，上面是保险柜密码，字迹与林志远的签名一致。
  - id: 4
    title: 指纹报告
    text: 金表盒表面提取到的指纹，与林志远的指纹吻合。

contradictions:
  - card: 2
    claim: 1
    concession: >-
      承认九点半上过十八楼，但坚称只是去十八楼储物间拿年会抽奖用的一箱零食礼包，
      拿完就坐电梯下楼了，没进老板办公室。
    slip: 嫌疑人说漏嘴，提到「十八楼那会儿走廊灯都关了」，暴露自己去过十八楼。
  - card: 3
    claim: 2
    concession: >-
      承认便利贴是自己写的，辩称是半年前替老板记的，贴在打印机旁忘了撕，
      记了也不代表用过。
    slip: 嫌疑人抱怨「我们行政部打印机旁边贴满了便条，谁记得住」，把话题引到打印机。
  - card: 4
    claim: 3
    concession: 彻底崩溃，承认拿了金表，说出欠债、打算先抵押周转再赎回的动机。
    slip: 嫌疑人下意识说「那个表盒挺沉的」，说完立刻改口。

stages:
  - name: 镇定
    emoji: 😌
    tone: 客气、配合、有条不紊，偶尔打官腔，完全不慌。
  # emoji 决定 TTS 语气，只能用当前音色真正支持的情绪（实测见 #3 的变更说明）
  - name: 狡辩
    emoji: 😠
    tone: 嘴硬、不耐烦、找借口，语气冲，试图把话题引开，对剩下的证词仍然坚持。
    slip_every: 5
  - name: 慌乱
    emoji: 😲
    tone: 结巴、前言不搭后语、一惊一乍，开始抱怨和求情，但还没认罪。
    slip_every: 4
  - name: 崩溃
    emoji: 😭
    tone: 哭腔、彻底放弃抵抗，承认一切。

reveal: >-
  林志远九点二十借口去洗手间离开包厢，九点三十二分独自上了十八楼，
  用半年前自己替老板记下、一直贴在打印机旁的密码打开保险柜，拿走金表，
  九点五十五分回到包厢连点三首歌装作一直在场。他欠了一笔债，想先抵押周转再悄悄放回去。

# 陪玩屏结局页的真相时间线（#37）：time 可省略，card 是对应的线索卡编号
timeline:
  - time: "21:20"
    text: 借口去洗手间，离开 KTV 包厢。
  - time: "21:32"
    text: 独自乘电梯上了十八楼。
    card: 2
  - text: 用半年前替老板记下、贴在打印机旁的密码打开保险柜。
    card: 3
  - text: 拿走金表，表盒上留下了指纹。
    card: 4
  - time: "21:55"
    text: 回到包厢连点三首歌，装作一直在场。

limits:
  strikes: 3
  minutes: 15
