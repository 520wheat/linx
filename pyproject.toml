[project]
name = "pozhan"
version = "0.1.0"
description = "《破绽》：在灵矽语音设备上审讯 AI 嫌疑人的侦探游戏"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "websockets>=13",  # 网页开玩：中转到灵矽设备 WebSocket（#43）
    "opuslib>=3.0",  # 需要系统安装 libopus
]

[project.scripts]
pozhan = "pozhan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

devsim = [
    "websockets>=13",
    "opuslib>=3.0",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pozhan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
