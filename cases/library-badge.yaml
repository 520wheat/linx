# 《破绽》第三个案件：善本室的实习生（#53）
# 初稿由 tools/draft_case.py 生成，人工审读改写：开场案情不再剧透卡的内容；
# 证据链改成每张卡单独就能驳倒一条证词（初稿的门禁日志只能证明老馆员的卡被用过）。
#
# 谎言链（编号是案件内部编号；玩家听到的「证词 N」按说出口的顺序编号）：
#   开场  1 下午没进过善本室 ──1 号卡──▶ 改口 4 只是帮老师拿材料、没碰东西 ──2 号卡──▶
#         改口 5 函套是掉地上帮着捡的、没打开 ──4 号卡──▶ 让步
#   开场  2 古籍一窍不通、调包干不来 ──5 号卡──▶ 让步
#   追问  3 实习生拿不到门禁卡（问到「门禁卡」才说）──3 号卡──▶ 让步
#   6 号卡（借过鉴定古籍的书）对证词 2 是间接证据

id: library-badge
title: 善本室的实习生

briefing: >-
  市图书馆善本室里，一页明代手札被人用仿品调了包。
  那天管善本室的老馆员赵建国请了病假，下午留在馆里的只有几个实习生。
  实习生刘思远现在就坐在你们对面。

suspect:
  name: 刘思远
  persona: >-
    二十四岁，图书情报专业的研究生，在图书馆实习三个月。性格内向，看着老实木讷，
    被问急了就反复说「我就是个实习生」，还会抱怨实习工资低、杂活多。欠了网贷，急需用钱，绝不主动提起。
    你就是刘思远，正在被审。不要礼貌得像前台，不要问好，不要问需要什么帮助。
    被问就缩、就推「我就是个实习生」，死不认偷了手札。
  truth:
    - 两周前，他在网上买了仿古宣纸、松烟墨和做旧用的茶叶，在宿舍仿制了一页手札。
    - 当天上午，他借口帮赵老师还书，在行政部签字借走了赵建国的门禁卡。
    - 下午两点十五分，他刷卡进了善本室，四十分钟后才出来。
    - 他用赵老师抽屉里的钥匙打开展柜，取出函套，翻开手札，用仿品调了包。
    - 函套上和手札内页都留下了他的指纹。
    - 真品还没卖出去，被他夹在一本旧画册里，放在宿舍书柜上。
    - 剩下的仿古宣纸和墨都锁在宿舍抽屉里，他平时根本不练字。
    - 赵老师没托他拿过任何会议材料，也没让他去善本室还书。
    - 他欠了网贷，已经联系好私人藏家，准备卖掉真品还债。
  stolen: [明代手札, 手札, 真品]  # 被盗物的叫法，守卫用来识别提前认罪
  confession: >-
    哭着承认用仿品调包了明代手札：两周前就买好纸墨仿了一页，借了赵老师的门禁卡溜进善本室换了出来；
    说自己欠了网贷还不上，准备把真品卖给私人藏家还债。

claims:
  - id: 1
    text: 那天下午我一直在外面书库理书，没进过善本室。
    lie: true
  - id: 2
    text: 古籍我一窍不通，调包这种事我也干不来。
    lie: true
  - id: 3
    text: 我一个实习生，善本室的门禁卡我根本拿不到。
    lie: true
    unlock:
      topic: 门禁卡（他有没有、从哪来、借过谁的）
      examples: [你有善本室的门禁卡吗, 你借过谁的门禁卡, 赵老师的门禁卡在哪, 善本室那道门你是怎么进去的]
  - id: 4
    text: 我进去只是帮赵老师拿一份会议材料，里面的东西一样没碰。
    lie: true
    unlock:
      after: 1
  - id: 5
    text: 函套是掉在地上我帮着捡起来的，里面根本没打开过。
    lie: true
    unlock:
      after: 4

cards:
  - id: 1
    title: 善本室门口监控
    text: 当天下午两点十五分，刘思远刷卡进了善本室，四十分钟后才出来。
  - id: 2
    title: 函套指纹报告
    text: 装手札的函套表面提取到多枚指纹，与刘思远的指纹吻合。
  - id: 3
    title: 门禁卡借用登记
    text: 当天上午，刘思远以「帮赵老师还书」为由，在行政部签字借走了赵建国的门禁卡。
  - id: 4
    title: 手札内页检测
    text: 函套里手札内页的衬纸上，检出一枚刘思远的拇指指纹。
  - id: 5
    title: 网购记录
    text: 两周前，刘思远在网上买了仿古宣纸、松烟墨和做旧用的茶叶，收货地址是他的宿舍。
  - id: 6
    title: 图书借阅记录
    text: 上个月，刘思远在馆里借过一本《明代书法真伪鉴别》。

contradictions:
  - card: 1
    claim: 1
    concession: 承认下午进过善本室，但坚称只是帮请病假的赵老师拿一份会议材料，里面的东西一样没碰。
    slip: 嫌疑人打了个哆嗦，说「善本室空调开得也太冷了」，说完才意识到不对。
  - card: 2
    claim: 4
    concession: 承认碰过函套，辩称函套从架子上掉了下来，他只是捡起来放回去，根本没打开过。
    slip: 嫌疑人看着手指说「那个函套边上有根毛刺，还划了我一下」。
  - card: 4
    claim: 5
    concession: 承认打开过函套翻看手札，但咬定只是好奇看看，看完就原样放回去了，没有调包。
    slip: 嫌疑人说漏嘴「那页纸薄得要命，翻的时候大气都不敢出」。
  - card: 3
    claim: 3
    concession: 承认借了赵老师的门禁卡，辩称是赵老师托他去善本室还书，他只是跑腿的。
    slip: 嫌疑人嘟囔「赵老师那张门禁卡平时就揣在兜里，我哪见得着」，说完不吭声了。
  - card: 5
    claim: 2
    concession: 承认网购过做旧的纸墨，支支吾吾说是业余练字用的，说不清为什么要做旧。
    slip: 嫌疑人顺口说「做旧最难的是茶汤的颜色」，说完赶紧低下头。

# 间接证据（#49）：沾边但驳不倒，出示不扣次数
weak:
  - card: 6
    claim: 2
    reason: 借过一本鉴别真伪的书，只能说明他看过，说明不了他会仿古籍、能调包。

stages:
  - name: 镇定
    emoji: 😌
    tone: 语气平稳，连连摆手，反复说自己只是个实习生，什么都不知道。
  - name: 狡辩
    emoji: 😠
    tone: 语气冲起来，皱着眉说自己好心帮忙反被冤枉，对剩下的说法死咬不放。
    slip_every: 5
  - name: 慌乱
    emoji: 😲
    tone: 结结巴巴，前后矛盾，开始抱怨老馆员总把杂活推给他，求侦探别再问了。
    slip_every: 4
  - name: 崩溃
    emoji: 😭
    tone: 带着哭腔，彻底放弃抵抗，断断续续交代整个调包换钱的计划。

reveal: >-
  刘思远两周前就网购纸墨仿制了一页手札。当天上午他借口帮赵老师还书，借走了门禁卡；
  下午两点十五分刷卡进入善本室，打开展柜，用仿品换走了真品，在函套和内页上都留下了指纹。
  他欠了网贷，准备把真品卖给私人藏家。

timeline:
  - text: 两周前网购仿古宣纸、松烟墨和做旧茶叶，在宿舍仿制了一页手札。
    card: 5
  - time: "上午"
    text: 借口帮赵老师还书，签字借走老馆员的门禁卡。
    card: 3
  - time: "14:15"
    text: 刷卡进入善本室，四十分钟后才出来。
    card: 1
  - text: 打开展柜取出函套，翻开手札，用仿品调了包。
    card: 4

limits:
  strikes: 3
  minutes: 15
