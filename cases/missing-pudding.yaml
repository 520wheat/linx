# 《破绽》新手教学关：消失的布丁（#57）
# 三条谎话，每种机制各演示一次，三分钟左右打完：
#   开场  1 一直在会议室开会 ──1 号卡──▶ 改口 2 只是去倒水、没开冰箱 ──2 号卡──▶ 让步
#   追问  3 从来不吃甜的（问到「爱不爱吃甜食」才说）──3 号卡──▶ 让步
#   4 号卡（垃圾桶里的勺子）对证词 2 是间接证据：说明有人吃了布丁，说明不了是他

id: missing-pudding
title: 消失的布丁（新手教学）

briefing: >-
  周五下午，茶水间冰箱里给老板准备的生日布丁不见了。
  设计组的周小满说他三点到四点一直在开会。
  他现在就坐在你们对面。

suspect:
  name: 周小满
  persona: >-
    二十六岁，设计组的视觉设计师，性格随和，说话爱用「害」「就是说」开头。
    心虚的时候会把话题扯到公司新买的咖啡机上。嘴馋，但死不承认。
  stolen: [布丁, 生日布丁]  # 被盗物的叫法，守卫用来识别提前认罪
  truth:
    - 三点到四点他根本没开会，那段时间所有会议室都没有预约。
    - 三点二十分他去了茶水间，打开冰箱，把布丁吃掉了。
    - 他用茶水间抽屉里的小勺子吃的，吃完把勺子扔进了茶水间的垃圾桶。
    - 他特别爱吃甜食，工位抽屉里塞满了巧克力和果冻。
    - 冰箱门上贴着「老板生日，勿动」的便签，他没注意到，以为是谁随手放的。
  confession: >-
    不好意思地承认三点二十去茶水间吃掉了布丁，说自己没看到冰箱上的便签，以为是谁随手放的，愿意马上赔一个新的。

claims:
  - id: 1
    text: 三点到四点我一直在会议室开会，没去过茶水间。
    lie: true
  - id: 2
    text: 我去茶水间只是倒了杯水，冰箱我都没开。
    lie: true
    unlock:
      after: 1
  - id: 3
    text: 我从来不吃甜的，布丁这种东西我碰都不碰。
    lie: true
    unlock:
      topic: 爱不爱吃甜食
      examples: [你爱吃甜食吗, 你平时吃布丁吗, 你喜欢吃甜的吗]

cards:
  - id: 1
    title: 会议室预约记录
    text: 周五下午三点到四点，所有会议室都没有预约，也没有人刷卡进出。
  - id: 2
    title: 茶水间监控
    text: 三点二十分，周小满打开冰箱，拿出一个小盒子，背对着镜头站了五分钟。
  - id: 3
    title: 工位抽屉照片
    text: 周小满的工位抽屉里塞满了巧克力、蛋糕和果冻。
  - id: 4
    title: 垃圾桶里的勺子
    text: 茶水间垃圾桶里有一把沾着奶油的小勺子。

contradictions:
  - card: 1
    claim: 1
    concession: 承认没开会，三点多去过一趟茶水间，但坚称只是去倒了杯水，冰箱都没开。
    slip: 嫌疑人随口说「茶水间那台新咖啡机真不错」，说完才发现自己说漏了去过茶水间。
  - card: 2
    claim: 2
    concession: 承认打开过冰箱，支支吾吾说只是看看有没有自己的酸奶，咬定没碰布丁。
    slip: 嫌疑人嘟囔「冰箱里那个盒子包得还挺好看」，说完赶紧闭嘴。
  - card: 3
    claim: 3
    concession: 承认自己爱吃甜食，但辩称爱吃甜的不代表吃了布丁。
    slip: 嫌疑人顺口说「那布丁一看就挺甜的」，说完咂了咂嘴。

# 间接证据（#49）：沾边但驳不倒，出示不扣次数
weak:
  - card: 4
    claim: 2
    reason: 勺子只能说明有人吃了布丁，说明不了是他吃的。

stages:
  - name: 镇定
    emoji: 😌
    tone: 轻松随和，嘻嘻哈哈，一副「这点小事至于吗」的样子。
  - name: 狡辩
    emoji: 😠
    tone: 有点急了，嘴硬，说大家小题大做，还想把话题扯到咖啡机上。
    slip_every: 4
  - name: 慌乱
    emoji: 😲
    tone: 结结巴巴，脸红，开始说好话求放过，但还没承认吃了布丁。
    slip_every: 3
  - name: 崩溃
    emoji: 😭
    tone: 哭笑不得，彻底认栽，连声道歉。

reveal: >-
  周小满三点多根本没开会。三点二十分他去茶水间打开冰箱，把老板的生日布丁吃掉了，勺子扔进了垃圾桶。
  他特别爱吃甜食，没注意到冰箱上「老板生日，勿动」的便签。

timeline:
  - time: "15:00"
    text: 说是去开会，其实那段时间没有任何会议。
    card: 1
  - time: "15:20"
    text: 在茶水间打开冰箱，拿出布丁。
    card: 2
  - text: 用小勺子吃完布丁，把勺子扔进垃圾桶。
    card: 4
  - text: 嘴馋的证据，就在他工位的抽屉里。
    card: 3

limits:
  strikes: 3
  minutes: 10
