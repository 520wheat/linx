# 《破绽》第二个案件：直播间里的手镯（#53）
# 初稿由 tools/draft_case.py 生成，人工审读改写：门锁卡改成「备用房卡 + 前台监控」，
# 间接证据换成真正驳不倒的卡，让步改成和戳破顺序无关的说法，口播里的时间改成中文读法。
#
# 谎言链（编号是案件内部编号；玩家听到的「证词 N」按说出口的顺序编号）：
#   开场  1 一直在房间直播 ──1 号卡──▶ 改口 4 出去拿了个外卖 ──4 号卡──▶ 让步
#   开场  2 没进过老板娘房间 ──2 号卡──▶ 改口 5 进去时手镯已经不见了 ──5 号卡──▶ 让步
#   追问  3 弹幕一条条都回了（问到「直播互动」才说）──3 号卡──▶ 让步
#   6 号卡（回放里弹幕很少）对证词 3 是间接证据

id: livestream-bracelet
title: 直播间里的手镯

briefing: >-
  昨晚八点到九点之间，民宿老板娘放在梳妆台上的翡翠手镯不见了。
  住在隔壁的美食主播许小糖说，那一个小时她一直在房间里直播吃夜宵。
  她现在就坐在你们对面。

suspect:
  name: 许小糖
  persona: >-
    二十五岁，美食主播，在这家民宿住了三天。说话甜，爱撒娇，习惯管人叫「宝宝」「家人们」。
    被问急了就委屈，说大家冤枉她。欠了直播平台一笔违约金，急需用钱，绝不主动提起。
  truth:
    - 晚上七点半，她用手机提前录了一段吃夜宵的视频，长五十八分钟。
    - 八点整，她用直播软件播放这段录像，假装在直播，一整个小时一句话、一条弹幕都没回。
    - 下午她在前台翻过放备用房卡的抽屉，拿走了老板娘房间的备用房卡。
    - 八点十八分，她用备用房卡打开老板娘的房门，进去时翡翠手镯还在梳妆台上。
    - 她在房间里待了十来分钟，拿走了手镯，八点半前回到自己房间。
    - 当晚她没有点外卖，民宿也没有外卖送来过。
    - 录像里吃的是她下午在镇上买的烤串和凉皮，那天晚上她没再吃别的东西。
    - 手镯被她藏在自己房间行李箱的夹层里，还没卖出去。
    - 她打算把手镯卖掉还平台的违约金。
  stolen: [翡翠手镯, 手镯, 镯子]  # 被盗物的叫法，守卫用来识别提前认罪
  confession: >-
    哭着承认提前录好视频假装直播，用前台拿的备用房卡溜进老板娘房间拿走了手镯；
    说自己欠了直播平台的违约金，实在没办法，想把手镯卖了先还钱。

claims:
  - id: 1
    text: 八点到九点我一直在房间直播，门都没出过。
    lie: true
  - id: 2
    text: 老板娘的房间，我进都没进过。
    lie: true
  - id: 3
    text: 那天的弹幕我一条一条都回了，跟家人们聊了一整晚。
    lie: true
    unlock:
      topic: 直播时和观众互动
      examples: [直播的时候你跟观众聊天了吗, 弹幕你都回了吗, 那晚直播间都聊了些什么]
  - id: 4
    text: 我就出去拿了个外卖，来回最多五分钟。
    lie: true
    unlock:
      after: 1
  - id: 5
    text: 我是听见里面有动静才推门看了一眼，那时候手镯已经不见了。
    lie: true
    unlock:
      after: 2

cards:
  - id: 1
    title: 手机里的视频
    text: 许小糖的手机相册里有一段晚上七点半拍的吃夜宵视频，长五十八分钟，和当晚的直播画面一模一样。
  - id: 2
    title: 门锁和前台监控
    text: 老板娘的房门八点十八分被备用房卡打开过一次；前台监控拍到，下午许小糖翻过放备用房卡的抽屉。
  - id: 3
    title: 直播后台数据
    text: 直播平台后台显示，晚上八点到九点，主播一句话没说，一条弹幕也没回。
  - id: 4
    title: 外卖与前台登记
    text: 许小糖的外卖账号当晚没有任何订单，民宿前台当晚也没有任何外卖送达登记。
  - id: 5
    title: 老板娘的朋友圈
    text: 老板娘晚上八点十五分发的朋友圈照片里，翡翠手镯还好好地放在梳妆台上。
  - id: 6
    title: 直播回放截图
    text: 当晚的直播回放里，一整个小时只有十几条弹幕，弹幕区很冷清。

contradictions:
  - card: 1
    claim: 1
    concession: 承认中间出去过一小会儿，但坚称只是去门口拿外卖，来回最多五分钟。
    slip: 嫌疑人小声嘀咕「那个视频我不是删了吗」，说完赶紧捂住嘴。
  - card: 4
    claim: 4
    concession: 承认根本没点外卖，支支吾吾说只是去走廊透了口气，绝不承认进过老板娘的房间。
    slip: 嫌疑人说「外卖是朋友帮我点的，我自己手机上肯定查不到」，说完才觉得不对。
  - card: 2
    claim: 2
    concession: 承认进过老板娘的房间，但辩称是路过听见里面有动静，才推门看了一眼，那时候手镯已经不见了。
    slip: 嫌疑人抱怨「那破门锁早该换了，备用卡就随手扔在前台抽屉里」，说完脸一下红了。
  - card: 5
    claim: 5
    concession: 承认进去的时候手镯还在梳妆台上，再也说不清自己在房间里那十来分钟干了什么。
    slip: 嫌疑人脱口而出「那手镯绿得发亮，水头真好」，说完才意识到自己说漏了。
  - card: 3
    claim: 3
    concession: 承认那一个小时一条弹幕都没回，支支吾吾说自己当时在专心吃东西。
    slip: 嫌疑人得意地说「我直播最会跟家人们互动了」，说完又改口说那晚有点累。

# 间接证据（#49）：沾边但驳不倒，出示不扣次数
weak:
  - card: 6
    claim: 3
    reason: 弹幕少只能说明那晚人气一般，说明不了她没回弹幕。

stages:
  - name: 镇定
    emoji: 😌
    tone: 说话软绵绵的，一口一个「宝宝」，对答如流，还反问侦探她有什么理由偷东西。
  - name: 狡辩
    emoji: 😠
    tone: 嗓门一下子提高，张口就是「你们冤枉我」，抢着打断，对剩下的说法仍然咬死不放。
    slip_every: 5
  - name: 慌乱
    emoji: 😲
    tone: 磕磕巴巴，前言不搭后语，开始求情，说再给她一次机会，但还在拼命找借口。
    slip_every: 4
  - name: 崩溃
    emoji: 😭
    tone: 带着哭腔，一边抽泣一边认罪，反复说自己不是故意的，是走投无路了。

reveal: >-
  许小糖晚上七点半提前录好一段吃夜宵的视频，八点用直播软件播放录像假装直播。
  她用下午从前台抽屉拿走的备用房卡，八点十八分打开老板娘的房门，拿走了梳妆台上的翡翠手镯。
  当晚根本没有外卖，她欠了直播平台的违约金，想卖掉手镯还钱。

timeline:
  - time: "19:30"
    text: 用手机提前录好一段吃夜宵的视频。
    card: 1
  - time: "20:00"
    text: 播放录像假装直播，一整个小时一条弹幕都没回。
    card: 3
  - time: "20:18"
    text: 用前台拿走的备用房卡，打开老板娘的房门。
    card: 2
  - time: "20:18–20:30"
    text: 拿走梳妆台上的翡翠手镯，回到自己房间。
    card: 5

limits:
  strikes: 3
  minutes: 15
