# 《破绽》第一个案件：年会夜的金表（第二版，#46 追问解锁）
# 内容为草稿，由组内（@520wheat）定稿，见 Proposal #3、#46。
# 格式说明见 src/pozhan/case/model.py；改完后运行 `uv run pozhan check cases/golden-watch.yaml` 校验。
#
# 谎言链（编号是案件内部编号；玩家听到的「证词 N」按说出口的顺序编号）：
#   开场  1 一直在包厢 ──2 号卡──▶ 改口 3 只是去储物间拿零食 ──6 号卡──▶ 让步
#   开场  2 碰都没碰过 ──4 号卡──▶ 改口 5 是下午布置展台时碰的 ──5 号卡──▶ 让步
#   追问  4 不知道保险柜密码（问到「保险柜密码」才说）──3 号卡──▶ 让步
#   1 号卡（点歌记录）对证词 1 是间接证据（weak）：不扣次数，但也驳不倒

id: golden-watch
title: 年会夜的金表

briefing: >-
  公司年会当晚九点到十点之间，十八楼老板办公室保险柜里的一块样品金表不见了。
  监控显示这段时间只有一个人离开过楼下的 KTV 包厢——行政主管林志远。
  他现在就坐在你们对面。

suspect:
  name: 林志远
  persona: >-
    三十八岁，公司行政主管，在公司干了十年，八面玲珑，说话爱打官腔，
    喜欢用「我们行政部」「流程上」这类词给自己壮胆。表面客气配合，
    被逼急了会抱怨自己工作辛苦、没人体谅。欠了一笔不小的私人债务，绝不主动提起。
  truth:
    - 九点二十分左右，林志远借口去洗手间离开 KTV 包厢。
    - 九点三十二分，他独自乘电梯上了十八楼。行政部在十六楼，十八楼只有老板办公室和一间储物间。
    - 他当晚没去过储物间。抽奖用的零食礼包下午五点就由行政部同事搬进了 KTV 包厢。
    - 他知道保险柜密码：半年前替老板记过一次，写在便利贴上，贴在行政部打印机旁边，一直没撕。
    - 金表下午六点由老板亲手锁进保险柜，年会展台上只摆了奖品模型，下午他没碰过表盒。
    - 他用密码打开保险柜，拿走了样品金表，金表盒上留下了他的指纹。
    - 九点五十五分左右他回到包厢，连点了三首歌，装作一直在场。
    - 他打算先拿表去抵押周转，等年终奖发下来再赎回放回去。
  stolen: [金表, 表, 样品金表]  # 被盗物的叫法，守卫用来识别提前认罪
  confession: >-
    彻底崩溃，承认九点半用便利贴上记的密码打开保险柜拿走了金表；
    说出自己欠了债，打算先拿表抵押周转，等年终奖发下来再赎回来放回去。

claims:
  - id: 1
    text: 九点到十点，我一直在楼下 KTV 包厢，没离开过。
    lie: true
  - id: 2
    text: 那块表我碰都没碰过。
    lie: true
  - id: 3
    text: 我上十八楼只是去储物间拿抽奖的零食礼包，拿完就下楼了。
    lie: true
    unlock:
      after: 1
  - id: 4
    text: 保险柜密码只有老板一个人知道，我根本不知道。
    lie: true
    unlock:
      topic: 保险柜密码
      examples: [你知道保险柜密码吗, 保险柜平时谁能打开, 密码都有谁知道]
  - id: 5
    text: 下午布置展台的时候我帮老板摆过表盒，指纹就是那时候留下的。
    lie: true
    unlock:
      after: 2

cards:
  - id: 1
    title: KTV 点歌记录
    text: 九点二十到九点五十，包厢里没有任何人点歌；九点五十五分之后林志远连点了三首歌。
  - id: 2
    title: 电梯监控截图
    text: 九点三十二分，林志远独自乘电梯到了十八楼。
  - id: 3
    title: 便利贴照片
    text: 行政部打印机旁贴着一张便利贴，上面是保险柜密码，字迹与林志远的签名一致。
  - id: 4
    title: 指纹报告
    text: 金表盒表面提取到的指纹，与林志远的指纹吻合。
  - id: 5
    title: 展台布置清单
    text: 年会展台只摆了抽奖奖品的模型；金表从下午六点起一直锁在保险柜里，是老板亲手放进去的。
  - id: 6
    title: 储物间门禁记录
    text: 十八楼储物间当晚没有任何刷卡记录；抽奖用的零食礼包下午五点就搬进了 KTV 包厢。

contradictions:
  - card: 2
    claim: 1
    concession: >-
      承认九点半上过十八楼，但坚称只是去储物间拿抽奖用的零食礼包，拿完就下楼了，没进老板办公室。
    slip: 嫌疑人说漏嘴，提到「十八楼那会儿走廊灯都关了」，暴露自己去过十八楼。
  - card: 6
    claim: 3
    concession: >-
      承认没去储物间，支支吾吾说只是上楼透透气，在走廊站了一会儿就下来了，绝不承认进过老板办公室。
    slip: 嫌疑人顺口说「那箱零食在包厢里堆了一下午」，说完才意识到不对。
  - card: 3
    claim: 4
    concession: >-
      承认便利贴是自己写的，辩称是半年前替老板记的，贴在打印机旁忘了撕，记得密码也不代表开过保险柜。
    slip: 嫌疑人抱怨「老板记性差，连保险柜密码都要我们行政部帮他记」，说完赶紧打住。
  - card: 4
    claim: 2
    concession: >-
      承认碰过表盒，但辩称是下午帮老板布置年会展台的时候摆过表盒，指纹是那时候留下的。
    slip: 嫌疑人下意识说「那个表盒挺沉的」，说完立刻改口。
  - card: 5
    claim: 5
    concession: >-
      承认下午根本没碰过表盒，再也说不清指纹是怎么来的，只会反复说自己不是故意的。
    slip: 嫌疑人说漏「金表那么贵，老板哪舍得拿出来摆」，说完脸色一变。

# 间接证据（#49）：沾边但驳不倒，出示不扣次数，嫌疑人按 reason 搪塞
weak:
  - card: 1
    claim: 1
    reason: 包厢里没人点歌，只能说明那会儿大家没唱歌，说明不了他人不在包厢。

stages:
  - name: 镇定
    emoji: 😌
    tone: 客气、配合、有条不紊，偶尔打官腔，完全不慌。
  # emoji 决定 TTS 语气，只能用当前音色真正支持的情绪（实测见 #3 的变更说明）
  - name: 狡辩
    emoji: 😠
    tone: 嘴硬、不耐烦、找借口，语气冲，试图把话题引开，对剩下的证词仍然坚持。
    slip_every: 5
  - name: 慌乱
    emoji: 😲
    tone: 结巴、前言不搭后语、一惊一乍，开始抱怨和求情，但还没认罪。
    slip_every: 4
  - name: 崩溃
    emoji: 😭
    tone: 哭腔、彻底放弃抵抗，承认一切。

reveal: >-
  林志远九点二十借口去洗手间离开包厢，九点三十二分独自上了十八楼，
  用半年前自己替老板记下、一直贴在打印机旁的密码打开保险柜，拿走金表，
  九点五十五分回到包厢连点三首歌装作一直在场。他欠了一笔债，想先抵押周转再悄悄放回去。

# 陪玩屏结局页的真相时间线（#37）：time 可省略，card 是对应的线索卡编号
timeline:
  - time: "21:20"
    text: 借口去洗手间，离开 KTV 包厢。
  - time: "21:32"
    text: 独自乘电梯上了十八楼，没去储物间。
    card: 2
  - text: 用半年前替老板记下、贴在打印机旁的密码打开保险柜。
    card: 3
  - text: 拿走金表，表盒上留下了指纹；下午他根本没碰过表盒。
    card: 4
  - time: "21:55"
    text: 回到包厢连点三首歌，装作一直在场。
    card: 1

limits:
  strikes: 3
  minutes: 15
